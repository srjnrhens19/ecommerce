<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nyt Sleepers | Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Gideon+Roman&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="design.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #8a9ef7;">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center fw-bold" href="index.html">
        <img src="logo.png" alt="Nyt Sleepers Logo" width="50" height="50" class="me-2">
        NYT SLEEPERS
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>  

  <main class="container py-5">
    <h2 class="text-center mb-4">Your Cart</h2>
  
    <div id="cart-container" class="row g-3">
    </div>
  
    <div class="d-flex justify-content-between align-items-center mt-4 p-3 bg-light shadow-sm rounded">
      <h4>Total: ₱<span id="cart-total">0</span></h4>
      <button class="btn btn-warning btn-lg">Proceed to Checkout</button>
    </div>
  </main>
  
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="removeToast" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="removeToastMessage"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <div class="modal fade" id="confirmRemoveModal" tabindex="-1" aria-labelledby="confirmRemoveLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content shadow">
        <div class="modal-header" style="background-color: #8a9ef7; color: white;">
          <h5 class="modal-title" id="confirmRemoveLabel">Remove from Cart</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center">
          <p id="confirmRemoveMessage" class="fw-semibold">
            Are you sure you want to remove this product from your cart?
          </p>
        </div>
        <div class="modal-footer">
          <button 
            type="button" 
            class="btn btn-secondary" 
            data-bs-dismiss="modal" 
            style="min-width: 120px; height: 45px;">
            Cancel
          </button>
          <button 
            type="button" 
            id="confirmRemoveBtn" 
            class="btn" 
            style="background-color: #dc3545; color: white; min-width: 120px; height: 45px; border: none;">
            Yes, Remove
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="removeSuccessModal" tabindex="-1" aria-labelledby="removeSuccessLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-body text-center p-4">
          <i class="bi bi-trash-fill text-danger" style="font-size: 3rem;"></i>
          <h5 class="mt-3 fw-bold" id="removeSuccessMessage">Product removed from cart!</h5>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2025 Nyt Sleepers | Follow us on</p>
    <div>
      <a href="#"><i class="bi bi-facebook"></i></a>
      <a href="#"><i class="bi bi-instagram"></i></a>
      <a href="#"><i class="bi bi-twitter"></i></a>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
